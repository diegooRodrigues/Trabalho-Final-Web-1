<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <title>Página de Cadastro</title>
    <link rel = "icon" href = "imagens/icone.webp">
    <link rel = "stylesheet" href = "cadastro.css">
</head>
<body>
    <div class="container">

        <header>
            <a href="index.html"><img src="imagens/logo.png" height="50px"></a>
            <h1>Castle Crashers Wiki</h1>
        </header>
        
        <main>
            
            <p>É necessário fazer cadastro para contribuir.</p>
            
            <form method="post">
                <fieldset>

                    <legend>Dados de Cadastro</legend>

                    <label>Usuário: <input type = "text" required></label>

                    <label>Nome Completo: <input type = "text" required></label>

                    <label>Nascimento: <input type = "date" required></label>

                    <label>Email: <input type = "email" required></label>

                    <label>Senha: <input type = "password" required></label>

                    <label>Concordo com os termos de uso <input type = "checkbox" required></label>

                    <input type="Submit" id="enviar">

                    <a href="index.html">Voltar à página principal</a>

                </fieldset>

            </form>

        </main>

    </div>
</body>
</html>
