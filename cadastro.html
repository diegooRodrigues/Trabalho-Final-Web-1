<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <title>Página de Cadastro</title>
    <link rel = "icon" href = "imagens/icone.webp">
    <link rel = "stylesheet" href = "cadastro.css">
</head>
<body>
    <div class="container">
        <div class="cabecalho">
            <a href="index.html"><img src="imagens/logo.png" height="50px"></a>
            <h1>Castle Crashers Wiki</h1>
        </div>
        <div class="informacao">
            <p>É necessário fazer cadastro para contribuir.</p>
        </div>
        <div class="formulario">
            <form method = "post">
                <p><label>Usuário: <input type = "text" required></label></p>
                <p><label>Nome Completo: <input type = "text" required></label></p>
                <p><label>Nascimento: <input type = "date" required></label></p>
                <p><label>Email: <input type = "email" required></label></p>
                <p><label>Senha: <input type = "password" required></label></p>
                <p><label>Concordo com os termos de uso <input type = "checkbox" required></label></p>
                <p><input type="Submit"></p>
                <p><a href="index.html">Voltar à página principal</a></p>
            </form>
        </div>
    </div>
</body>
</html>
